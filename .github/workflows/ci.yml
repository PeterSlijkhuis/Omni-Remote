name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check dist is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/omni-remote-card.js is out of date. Run npm run build and commit the result."
            git diff --stat -- dist
            exit 1
          fi
